# Builds and publishes both images to GitHub Container Registry when a version tag (v1.2.3) is pushed:
#   ghcr.io/<owner>/<repo>-api and ghcr.io/<owner>/<repo>-web
#   tagged 1.2.3, 1.2, 1, latest and sha-<commit>
name: Docker images

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify package versions match the release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:check -- "$RELEASE_TAG"
      - name: Version synchronization tests
        run: npm run test:version
      - name: Backend tests
        working-directory: backend
        run: npm ci --ignore-scripts && npm test
      - name: Frontend tests
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run test:icons && npx ng test --watch=false
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Production builds
        run: npm run build
      - name: Development frontend build
        run: npm run build --prefix frontend -- --configuration development

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # "latest" only moves on version tags, never on manual runs.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
